<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09070b">
  <title>The Church of Overlord</title>
  <meta name="description" content="The Church of Overlord — One Flame. One Law. One Balance.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img class="hero-banner" src="assets/banner.png" alt="The Church of Overlord banner">
  </header>

  <main>
    <section class="intro">
      <img class="sigil" src="assets/symbol.png" alt="Church of Overlord symbol">
      <p class="motto">ONE FLAME. ONE LAW. ONE BALANCE.</p>
    </section>

    <section class="video-section" aria-labelledby="video-title">
      <div class="section-heading">
        <span></span>
        <h2 id="video-title">THE MESSAGE</h2>
        <span></span>
      </div>

      <!--
        PARA COLOCAR O TEU VÍDEO:
        1. Abre o vídeo no YouTube.
        2. Copia o código que aparece depois de "v=" no endereço.
           Exemplo: youtube.com/watch?v=ABC123XYZ
           O ID é: ABC123XYZ
        3. Substitui VIDEO_ID abaixo por esse código.
      -->
      <div class="video-frame">
        <iframe
          src="https://www.youtube-nocookie.com/embed/2HGI_hD7JSM"
          title="The Church of Overlord"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>
      
    </section>

    <section class="documents" aria-label="Church documents">
      <article class="document-card">
        <img src="assets/doctrine.png" alt="Doctrine of the Church of Overlord">
      </article>

      <article class="document-card">
        <img src="assets/creed.png" alt="The Creed of the Church of Overlord">
      </article>

      <article class="document-card wide">
        <img src="assets/ten-laws.png" alt="The Ten Laws of the Church of Overlord">
      </article>
    </section>
  </main>

  <footer>
    <img src="assets/symbol.png" alt="" class="footer-sigil">
    <p>PRAISE PA’AGRIO · HONOUR THE ANCESTORS · TRUST THE LORD</p>
  </footer>
</body>
</html>
